{% extends "base.html" %}

{% block title %}Restablecer Contraseña - TaskControl{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Restablecer Contraseña</h2>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST" novalidate>
        <div class="form-group">
            <label for="new_password">Nueva Contraseña</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8" placeholder="Mínimo 8 caracteres">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirmar Nueva Contraseña</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8" placeholder="Repite tu nueva contraseña">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Restablecer Contraseña</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600;">Volver a Iniciar Sesión</a>
    </p>
</div>
{% endblock %}
