{% extends "base.html" %}

{% block title %}Iniciar Sesión - TaskControl{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Iniciar Sesión</h2>
    
    <form action="{{ url_for('auth.login') }}" method="POST" novalidate>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="tu@ejemplo.com" value="{{ email or '' }}">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Tu contraseña">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Entrar</button>
    </form>

    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        <a href="{{ url_for('auth.forgot_password') }}" style="color: var(--text-muted);">¿Olvidaste tu contraseña?</a>
    </p>

    <p style="margin-top: 0.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600;">Regístrate</a>
    </p>
</div>
{% endblock %}
